[package]
name = "hamsa-beta"
version = "0.1.0"
edition = "2021"
description = "Hamsa Beta: local voice dictation for Windows, native Rust UI (Slint)"
license = "Apache-2.0"
publish = false

[[bin]]
name = "hamsa-beta"
path = "src/main.rs"

[dependencies]
hamsa-core = { path = "../core" }
phonon = { path = "../phonon" }
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility", "unstable-winit-030"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
ttf-parser = "0.25"
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.19"
embed-resource = "3"
