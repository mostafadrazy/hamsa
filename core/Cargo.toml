[package]
name = "hamsa-core"
version = "0.1.0"
edition = "2021"
description = "Hamsa's app logic without UI: audio, shortcut, models, dictation, vocabulary, preferences"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Microphone capture (WASAPI on Windows), resampling to 16 kHz, WAV output.
cpal = "0.15"
rubato = "0.15"
hound = "3.5"
# Speech recognition engine (Phonon-2.5, pure Rust).
phonon = { path = "../phonon" }
# Model downloads and pasting text.
ureq = "2"
sha2 = "0.10"
arboard = "3"
# Unpacking the llama.cpp release (deflate only).
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
